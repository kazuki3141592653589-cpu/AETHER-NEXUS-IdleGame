<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>AETHER NEXUS - オンラインランキング</title>
    <style>
        :root {
            --bg-color: #050b14;
            --panel-bg: rgba(10, 25, 45, 0.98);
            --border-color: #00f3ff;
            --accent-color: #00f3ff;
            --text-color: #e0f7ff;
            --sub-text: #8ab4f8;
            --glow: 0 0 15px rgba(0, 243, 255, 0.4);
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        body::before {
            content: "";
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: 
                linear-gradient(rgba(0, 243, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 243, 255, 0.03) 1px, transparent 1px);
            background-size: 30px 30px;
            z-index: -1;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 20px;
            background: rgba(5, 11, 20, 0.95);
            border-bottom: 1px solid rgba(0, 243, 255, 0.3);
            font-size: 1.1rem;
            letter-spacing: 2px;
            color: var(--accent-color);
            text-shadow: var(--glow);
            z-index: 60;
        }

        .container {
            display: flex;
            flex: 1;
            overflow: hidden;
            position: relative;
        }

        .main-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            padding: 20px;
        }

        .rival-box {
            display: flex;
            gap: 15px;
            margin-bottom: 15px;
            background: rgba(2, 8, 23, 0.8);
            border: 1px solid rgba(0, 243, 255, 0.2);
            padding: 8px 15px;
            border-radius: 6px;
            font-size: 0.85rem;
        }

        .rival-item {
            color: var(--sub-text);
        }

        .rival-item span {
            color: #fff;
            font-weight: bold;
        }

        .status-board {
            text-align: center;
            margin-bottom: 15px;
        }

        .energy-display {
            font-size: 2.3rem;
            font-weight: bold;
            color: #fff;
            text-shadow: 0 0 20px var(--accent-color);
        }

        .fps-display {
            font-size: 0.85rem;
            color: var(--sub-text);
            margin-top: 5px;
        }

        .core-container {
            position: relative;
            width: 200px;
            height: 200px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            margin: 15px 0;
            -webkit-tap-highlight-color: transparent;
        }

        .energy-core {
            width: 150px;
            height: 150px;
            background: radial-gradient(circle, #00f3ff 0%, #0066ff 60%, #020817 100%);
            border-radius: 50%;
            box-shadow: 0 0 30px var(--accent-color), inset 0 0 20px #ffffff;
            transition: transform 0.1s ease;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .energy-core:active {
            transform: scale(0.95);
        }

        .core-ring {
            position: absolute;
            width: 190px;
            height: 190px;
            border: 2px dashed rgba(0, 243, 255, 0.5);
            border-radius: 50%;
            animation: rotate 20s linear infinite;
        }

        @keyframes rotate {
            100% { transform: rotate(360deg); }
        }

        .floating-text {
            position: absolute;
            font-weight: bold;
            color: #00ffff;
            pointer-events: none;
            animation: floatUp 0.8s ease-out forwards;
            font-size: 1.2rem;
            text-shadow: 0 0 5px #000;
            z-index: 100;
        }

        @keyframes floatUp {
            0% { opacity: 1; transform: translateY(0) scale(1); }
            100% { opacity: 0; transform: translateY(-60px) scale(1.2); }
        }

        .sub-panel {
            width: 100%;
            max-width: 450px;
            background: var(--panel-bg);
            border-left: 1px solid rgba(0, 243, 255, 0.2);
            display: flex;
            flex-direction: column;
            height: 100%;
            position: absolute;
            right: 0;
            top: 0;
            transform: translateX(100%);
            transition: transform 0.3s ease;
            z-index: 50;
        }

        .sub-panel.open {
            transform: translateX(0);
        }

        .panel-header {
            padding: 15px;
            background: rgba(0, 243, 255, 0.1);
            border-bottom: 1px solid rgba(0, 243, 255, 0.2);
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: bold;
        }

        .close-btn {
            background: none;
            border: 1px solid var(--accent-color);
            color: var(--accent-color);
            padding: 5px 10px;
            cursor: pointer;
            border-radius: 4px;
        }

        .panel-content {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
        }

        .item-card {
            background: rgba(2, 15, 35, 0.7);
            border: 1px solid rgba(0, 243, 255, 0.2);
            border-radius: 6px;
            padding: 12px;
            margin-bottom: 10px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .item-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .item-name {
            font-weight: bold;
            font-size: 0.95rem;
        }

        .item-level {
            font-size: 0.85rem;
            color: var(--sub-text);
        }

        .item-details {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.85rem;
            color: #a0c4ff;
        }

        .buy-btn {
            background: linear-gradient(135deg, #0066ff, #00f3ff);
            border: none;
            color: #fff;
            padding: 8px 14px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            touch-action: manipulation;
        }

        .buy-btn:disabled {
            background: #2a3a50;
            color: #6c7a9c;
            cursor: not-allowed;
        }

        .menu-toggle-bar {
            display: flex;
            justify-content: center;
            gap: 8px;
            padding: 10px;
            background: rgba(2, 8, 23, 0.95);
            flex-wrap: wrap;
        }

        .menu-btn {
            background: rgba(0, 243, 255, 0.1);
            border: 1px solid var(--accent-color);
            color: var(--accent-color);
            padding: 8px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.85rem;
            text-shadow: var(--glow);
        }

        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(2, 8, 23, 0.85);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .modal-overlay.open {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-box {
            background: var(--panel-bg);
            border: 1px solid var(--accent-color);
            border-radius: 8px;
            width: 90%;
            max-width: 500px;
            max-height: 80vh;
            display: flex;
            flex-direction: column;
            box-shadow: 0 0 25px rgba(0, 243, 255, 0.3);
        }

        .modal-header {
            padding: 15px;
            background: rgba(0, 243, 255, 0.1);
            border-bottom: 1px solid rgba(0, 243, 255, 0.2);
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: bold;
        }

        .modal-body {
            padding: 20px;
            overflow-y: auto;
            font-size: 0.9rem;
            line-height: 1.6;
            color: var(--text-color);
        }

        .name-input-group {
            display: flex;
            gap: 8px;
            margin-top: 8px;
        }

        .name-input {
            flex: 1;
            background: rgba(2, 8, 23, 0.8);
            border: 1px solid var(--accent-color);
            border-radius: 4px;
            padding: 8px 12px;
            color: #fff;
            font-size: 0.95rem;
            outline: none;
        }

        .ranking-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
            font-size: 0.85rem;
        }

        .ranking-table th, .ranking-table td {
            padding: 8px;
            border-bottom: 1px solid rgba(0, 243, 255, 0.2);
            text-align: left;
        }

        .ranking-table th {
            color: var(--accent-color);
        }

        @media (min-width: 768px) {
            .container {
                max-width: 1200px;
                margin: 0 auto;
                width: 100%;
                border: 1px solid rgba(0, 243, 255, 0.2);
                border-top: none;
            }
            .sub-panel {
                position: relative;
                transform: translateX(0);
                max-width: 400px;
                height: 100%;
            }
            .menu-toggle-bar {
                display: none;
            }
        }
    </style>
</head>
<body>

    <header>
        <span id="header-title">AETHER NEXUS</span>
    </header>

    <div class="container">
        <div class="main-panel">
            <!-- PCライバル & スマホライバル表示 -->
            <div class="rival-box">
                <div class="rival-item">PC[Xenos]: <span id="rival-pc-val">0</span> Λ</div>
                <div class="rival-item">スマホ[Nova]: <span id="rival-mob-val">0</span> Λ</div>
            </div>

            <div class="status-board">
                <div class="energy-display"><span id="energy-val">0</span> Λ</div>
                <div class="fps-display">自動発電: <span id="cps-val">0</span> Λ/s | 倍率: x<span id="mult-val">1.0</span></div>
            </div>

            <div class="core-container" id="core-btn">
                <div class="core-ring"></div>
                <div class="energy-core"></div>
            </div>

            <div class="menu-toggle-bar">
                <button class="menu-btn" onclick="openPanel('generators')">発電機</button>
                <button class="menu-btn" onclick="openPanel('upgrades')">強化</button>
                <button class="menu-btn" onclick="openPanel('ranking')">🌐 オンライン順位</button>
            </div>
        </div>

        <!-- 発電機パネル -->
        <div id="panel-generators" class="sub-panel">
            <div class="panel-header">
                <span>自動発電機（長押し連続購入）</span>
                <button class="close-btn" onclick="closePanel()">閉じる</button>
            </div>
            <div class="panel-content" id="generator-list"></div>
        </div>

        <!-- アップグレードパネル -->
        <div id="panel-upgrades" class="sub-panel">
            <div class="panel-header">
                <span>タップ性能強化</span>
                <button class="close-btn" onclick="closePanel()">閉じる</button>
            </div>
            <div class="panel-content" id="upgrade-list"></div>
        </div>

        <!-- オンラインランキングパネル -->
        <div id="panel-ranking" class="sub-panel">
            <div class="panel-header">
                <span>🌐 人同士のオンラインランキング</span>
                <button class="close-btn" onclick="closePanel()">閉じる</button>
            </div>
            <div class="panel-content" style="text-align: center;">
                <div style="text-align: left; background: rgba(0,243,255,0.05); border: 1px solid rgba(0,243,255,0.3); border-radius: 6px; padding: 10px; margin-bottom: 12px;">
                    <div style="font-size: 0.8rem; color: var(--sub-text); margin-bottom: 4px;">プレイヤー名</div>
                    <div class="name-input-group">
                        <input type="text" id="player-name-input" class="name-input" maxlength="15" placeholder="名前を入力">
                        <button class="buy-btn" style="padding: 6px 12px; font-size: 0.85rem;" onclick="updatePlayerName()">更新</button>
                    </div>
                </div>

                <button class="buy-btn" style="width: 100%; padding: 10px; margin-bottom: 15px;" onclick="syncScoreToFirebase()">スコアをサーバーに送信・更新</button>

                <div style="text-align: left; font-weight: bold; color: var(--accent-color); margin-bottom: 5px;">🔥 全国のライバル一覧 (上位10件)</div>
                <table class="ranking-table">
                    <thead>
                        <tr>
                            <th>順位</th>
                            <th>名前</th>
                            <th>累計エネルギー</th>
                        </tr>
                    </thead>
                    <tbody id="ranking-tbody">
                        <tr><td colspan="3" style="text-align: center; color: var(--sub-text);">読み込み中...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- 初回名前入力モーダル -->
    <div id="name-modal" class="modal-overlay">
        <div class="modal-box">
            <div class="modal-header">
                <span>パイロット登録</span>
            </div>
            <div class="modal-body" style="text-align: center;">
                <p style="margin-top: 0;">AETHER NEXUSへようこそ。<br>ランキングに載せるあなたの名前を入力してください。</p>
                <input type="text" id="initial-name-input" class="name-input" maxlength="15" value="開拓者" style="width: 100%; margin-bottom: 15px; text-align: center;">
                <button class="buy-btn" style="width: 100%; padding: 10px;" onclick="saveInitialName()">ゲームを開始する</button>
            </div>
        </div>
    </div>

    <!-- Firebase SDK & ゲームロジック -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.0.0/firebase-app.js";
        import { getFirestore, collection, doc, setDoc, query, orderBy, limit, getDocs } from "https://www.gstatic.com/firebasejs/10.0.0/firebase-firestore.js";

        // 提供されたFirebase設定
        const firebaseConfig = {
            apiKey: "AIzaSyAEXvNobXa_JcH8Dsk-AdPOX1uhtbQmTNM",
            authDomain: "only-27b78.firebaseapp.com",
            projectId: "only-27b78",
            storageBucket: "only-27b78.firebasestorage.app",
            messagingSenderId: "931912886094",
            appId: "1:931912886094:web:df29525a6ac2684765601f",
            measurementId: "G-JWRGC9ZERS"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // グローバルにスコア送信関数を公開
        window.syncScoreToFirebase = async function() {
            try {
                // プレイヤー固有のIDをローカルストレージから取得・生成
                let uid = localStorage.getItem('aether_uid');
                if (!uid) {
                    uid = 'user_' + Math.random().toString(36.2, 9);
                    localStorage.setItem('aether_uid', uid);
                }

                await setDoc(doc(db, "rankings", uid), {
                    name: game.playerName,
                    score: Math.floor(game.totalEarned),
                    updatedAt: Date.now()
                });
                alert("スコアをオンラインランキングに送信しました！");
                loadOnlineRanking();
            } catch (e) {
                console.error("送信エラー:", e);
                alert("送信に失敗しました。Firestoreの設定を確認してください。");
            }
        };

        async function loadOnlineRanking() {
            const tbody = document.getElementById('ranking-tbody');
            tbody.innerHTML = `<tr><td colspan="3" style="text-align: center; color: var(--sub-text);">読み込み中...</td></tr>`;
            try {
                const q = query(collection(db, "rankings"), orderBy("score", "desc"), limit(10));
                const querySnapshot = await getDocs(q);
                
                tbody.innerHTML = "";
                let rank = 1;
                querySnapshot.forEach((docSnap) => {
                    const data = docSnap.data();
                    const tr = document.createElement('tr');
                    tr.innerHTML = `<td>${rank}位</td><td>${escapeHtml(data.name)}</td><td>${formatNumber(data.score)} Λ</td>`;
                    tbody.appendChild(tr);
                    rank++;
                });
                if (rank === 1) {
                    tbody.innerHTML = `<tr><td colspan="3" style="text-align: center; color: var(--sub-text);">まだランキングデータがありません</td></tr>`;
                }
            } catch (e) {
                console.error("取得エラー:", e);
                tbody.innerHTML = `<tr><td colspan="3" style="text-align: center; color: #ff6b6b;">読み込みエラー</td></tr>`;
            }
        }

        function escapeHtml(str) {
            return str.replace(/[&'`"<>]/g, (match) => {
                return { '&': '&amp;', "'": '&#x27;', '`': '&#x60;', '"': '&quot;', '<': '&lt;', '>': '&gt;' }[match];
            });
        }

        // 初期ロード時にランキング取得
        loadOnlineRanking();
        window.loadOnlineRanking = loadOnlineRanking;
    </script>

    <script>
        let game = {
            playerName: "開拓者",
            energy: 0,
            totalEarned: 0,
            totalTaps: 0,
            tapPower: 1,
            multiplier: 1.0,
            generators: [],
            upgrades: []
        };

        // ローカルライバル（PCとスマホライバル）
        let rivalPC = { energy: 0, speed: 15 };
        let rivalMobile = { energy: 0 };

        const generatorData = [
            { name: "小型発電セル", baseCost: 15, baseProd: 0.5 },
            { name: "ミニタービン", baseCost: 100, baseProd: 4 },
            { name: "ソーラーユニット", baseCost: 1100, baseProd: 32 },
            { name: "熱交換器", baseCost: 12000, baseProd: 260 },
            { name: "電磁コイル", baseCost: 130000, baseProd: 1400 },
            { name: "水流ジェネレーター", baseCost: 1400000, baseProd: 7800 },
            { name: "風力ユニット", baseCost: 20000000, baseProd: 44000 },
            { name: "蓄電コンバーター", baseCost: 330000000, baseProd: 260000 }
        ];

        const upgradeData = [
            { id: 'tap1', name: '超導電パルス', cost: 50, powerAdd: 1, level: 0, max: 20 },
            { id: 'tap2', name: 'クォーク・ブースター', cost: 500, powerAdd: 5, level: 0, max: 20 }
        ];

        function initGame() {
            if (!loadGame()) {
                game.generators = generatorData.map(g => ({ ...g, count: 0, cost: g.baseCost }));
                game.upgrades = upgradeData.map(u => ({ ...u }));
                document.getElementById('name-modal').classList.add('open');
            } else {
                document.getElementById('name-modal').classList.remove('open');
            }
            document.getElementById('player-name-input').value = game.playerName;
            renderGenerators();
            renderUpgrades();
        }

        function saveInitialName() {
            const inputVal = document.getElementById('initial-name-input').value.trim();
            if (inputVal) game.playerName = inputVal;
            document.getElementById('name-modal').classList.remove('open');
            saveGame();
        }

        function updatePlayerName() {
            const inputVal = document.getElementById('player-name-input').value.trim();
            if (inputVal) {
                game.playerName = inputVal;
                saveGame();
                alert(`プレイヤー名を "${game.playerName}" に変更しました！`);
            } else {
                alert("有効な名前を入力してください。");
            }
        }

        function saveGame() {
            localStorage.setItem('aether_nexus_save_v3', JSON.stringify(game));
        }

        function loadGame() {
            const saved = localStorage.getItem('aether_nexus_save_v3');
            if (!saved) return false;
            try {
                const data = JSON.parse(saved);
                game.playerName = data.playerName || "開拓者";
                game.energy = data.energy || 0;
                game.totalEarned = data.totalEarned || 0;
                game.tapPower = data.tapPower || 1;
                game.multiplier = data.multiplier || 1.0;

                game.generators = generatorData.map((g, i) => {
                    const savedGen = data.generators && data.generators[i];
                    return { ...g, count: savedGen ? savedGen.count : 0, cost: savedGen ? savedGen.cost : g.baseCost };
                });
                game.upgrades = upgradeData.map((u, i) => {
                    const savedUp = data.upgrades && data.upgrades[i];
                    return { ...u, level: savedUp ? savedUp.level : 0, cost: savedUp ? savedUp.cost : u.cost };
                });
                return true;
            } catch (e) {
                return false;
            }
        }

        function formatNumber(num) {
            if (num < 1000) return num.toFixed(0);
            const suffixes = ["", "KΛ", "MΛ", "GΛ", "TΛ", "PΛ"];
            const i = Math.floor(Math.log10(num) / 3);
            if (i >= suffixes.length) return num.toExponential(2);
            return `${(num / Math.pow(10, i * 3)).toFixed(2)} ${suffixes[i]}`;
        }

        document.getElementById('core-btn').addEventListener('click', (e) => {
            let gain = game.tapPower * game.multiplier;
            game.energy += gain;
            game.totalEarned += gain;
            createFloatingText(e.clientX, e.clientY, `+${formatNumber(gain)}`);
        });

        function createFloatingText(x, y, text) {
            const el = document.createElement('div');
            el.className = 'floating-text';
            el.innerText = text;
            el.style.left = `${x - 20}px`;
            el.style.top = `${y - 30}px`;
            document.body.appendChild(el);
            setTimeout(() => el.remove(), 800);
        }

        function buyGenerator(index) {
            let gen = game.generators[index];
            if (game.energy >= gen.cost) {
                game.energy -= gen.cost;
                gen.count++;
                gen.cost = Math.floor(gen.baseCost * Math.pow(1.15, gen.count));
                renderGenerators();
            }
        }

        function buyUpgrade(index) {
            let up = game.upgrades[index];
            if (game.energy >= up.cost && up.level < up.max) {
                game.energy -= up.cost;
                game.tapPower += up.powerAdd;
                up.level++;
                up.cost = Math.floor(up.cost * 1.8);
                renderUpgrades();
            }
        }

        let holdInterval = null;
        function startHolding(event, type, index) {
            event.preventDefault();
            stopHolding();
            executeAction(type, index);
            holdInterval = setInterval(() => executeAction(type, index), 120);
        }
        function stopHolding() {
            if (holdInterval) { clearInterval(holdInterval); holdInterval = null; }
        }
        function executeAction(type, index) {
            if (type === 'gen') buyGenerator(index);
            if (type === 'up') buyUpgrade(index);
        }

        function renderGenerators() {
            document.getElementById('generator-list').innerHTML = game.generators.map((gen, i) => `
                <div class="item-card">
                    <div class="item-info"><span class="item-name">${gen.name}</span><span class="item-level">所持: ${gen.count}</span></div>
                    <div class="item-details">
                        <span>生産: ${formatNumber(gen.baseProd * gen.count)} Λ/s</span>
                        <button class="buy-btn" onmousedown="startHolding(event, 'gen', ${i})" onmouseup="stopHolding()" onmouseleave="stopHolding()" ontouchstart="startHolding(event, 'gen', ${i})" ontouchend="stopHolding()" ontouchcancel="stopHolding()">${formatNumber(gen.cost)} Λ</button>
                    </div>
                </div>
            `).join('');
        }

        function renderUpgrades() {
            document.getElementById('upgrade-list').innerHTML = game.upgrades.map((up, i) => `
                <div class="item-card">
                    <div class="item-info"><span class="item-name">${up.name} (Lv.${up.level}/${up.max})</span></div>
                    <div class="item-details">
                        <span>+${up.powerAdd} タップ</span>
                        <button class="buy-btn" onmousedown="startHolding(event, 'up', ${i})" onmouseup="stopHolding()" onmouseleave="stopHolding()" ontouchstart="startHolding(event, 'up', ${i})" ontouchend="stopHolding()" ontouchcancel="stopHolding()">${up.level >= up.max ? 'MAX' : formatNumber(up.cost) + ' Λ'}</button>
                    </div>
                </div>
            `).join('');
        }

        let lastTime = performance.now();
        let saveTimer = 0;

        function gameLoop(now) {
            const delta = (now - lastTime) / 1000;
            lastTime = now;

            let totalCps = 0;
            game.generators.forEach(gen => { totalCps += gen.baseProd * gen.count; });

            let frameGain = totalCps * delta * game.multiplier;
            game.energy += frameGain;
            game.totalEarned += frameGain;

            // PC・スマホライバルの進行
            rivalPC.energy += rivalPC.speed * delta;
            if (Math.random() > 0.85) rivalMobile.energy += 30;

            saveTimer += delta;
            if (saveTimer >= 5) { saveGame(); saveTimer = 0; }

            document.getElementById('energy-val').innerText = formatNumber(game.energy);
            document.getElementById('cps-val').innerText = formatNumber(totalCps * game.multiplier);
            document.getElementById('mult-val').innerText = game.multiplier.toFixed(1);
            document.getElementById('rival-pc-val').innerText = formatNumber(rivalPC.energy);
            document.getElementById('rival-mob-val').innerText = formatNumber(rivalMobile.energy);

            updateButtonStates();
            requestAnimationFrame(gameLoop);
        }

        function updateButtonStates() {
            game.generators.forEach((gen, i) => {
                const btn = document.querySelectorAll('#generator-list .buy-btn')[i];
                if (btn) btn.disabled = game.energy < gen.cost;
            });
            game.upgrades.forEach((up, i) => {
                const btn = document.querySelectorAll('#upgrade-list .buy-btn')[i];
                if (btn) btn.disabled = game.energy < up.cost || up.level >= up.max;
            });
        }

        function openPanel(name) {
            document.querySelectorAll('.sub-panel').forEach(p => p.classList.remove('open'));
            document.getElementById(`panel-${name}`).classList.add('open');
        }
        function closePanel() {
            document.querySelectorAll('.sub-panel').forEach(p => p.classList.remove('open'));
        }

        initGame();
        requestAnimationFrame(gameLoop);
    </script>
</body>
</html>
