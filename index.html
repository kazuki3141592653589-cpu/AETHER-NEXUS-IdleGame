<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AETHER NEXUS</title>
  <style>
    :root {
      --bg-color: #0b0f19;
      --card-bg: #151d30;
      --accent-color: #00d2ff;
      --text-color: #ffffff;
      --sub-text: #8a99ad;
      --border-color: #233252;
    }
    body {
      margin: 0; padding: 0; background-color: var(--bg-color); color: var(--text-color);
      font-family: sans-serif; text-align: center; display: flex; flex-direction: column; align-items: center;
    }
    .container { width: 100%; max-width: 500px; padding: 15px; box-sizing: border-box; }
    
    .resource-box { background: var(--card-bg); padding: 15px; border-radius: 8px; margin-bottom: 15px; border: 1px solid var(--border-color); }
    .energy-val { font-size: 2rem; font-weight: bold; color: var(--accent-color); }
    
    .tap-btn {
      width: 120px; height: 120px; border-radius: 50%; border: 3px solid var(--accent-color);
      background: radial-gradient(circle, #005f73 0%, #0a1128 100%); color: #fff;
      font-size: 1.2rem; font-weight: bold; cursor: pointer; margin: 10px 0; transition: transform 0.05s;
    }
    .tap-btn:active { transform: scale(0.95); }

    .map-container { background: var(--card-bg); padding: 10px; border-radius: 8px; margin-bottom: 15px; border: 1px solid var(--border-color); }
    .zone-title { font-weight: bold; font-size: 1.1rem; color: var(--accent-color); margin-bottom: 8px; }
    .map-nodes { display: flex; flex-wrap: wrap; gap: 5px; justify-content: center; max-height: 120px; overflow-y: auto; }
    .node-btn { padding: 5px 8px; font-size: 0.75rem; border-radius: 4px; border: 1px solid var(--border-color); background: #0d1322; color: #8a99ad; cursor: pointer; }
    .node-btn.unlocked { color: #fff; border-color: var(--accent-color); }
    .node-btn.active { background: var(--accent-color); color: #000; font-weight: bold; }

    .section-title { text-align: left; font-size: 1rem; margin: 10px 0 5px; color: var(--sub-text); }
    .gen-list { display: flex; flex-direction: column; gap: 8px; }
    .gen-card {
      background: var(--card-bg); padding: 10px; border-radius: 6px; border: 1px solid var(--border-color);
      display: flex; justify-content: space-between; align-items: center; text-align: left;
    }
    .gen-info { font-size: 0.85rem; }
    .gen-name { font-weight: bold; font-size: 0.95rem; }
    .gen-desc { font-size: 0.75rem; color: var(--sub-text); }
    .buy-btn {
      background: var(--accent-color); border: none; padding: 6px 12px; border-radius: 4px;
      font-weight: bold; cursor: pointer; color: #000;
    }
    .buy-btn:disabled { background: #3a4b6e; color: #7a8b9e; cursor: not-allowed; }
    .prestige-btn { background: #ff4757; color: #fff; margin-top: 10px; padding: 8px; border: none; border-radius: 4px; width: 100%; font-weight: bold; cursor: pointer; }
  </style>
</head>
<body>

<div class="container">
  <h1>AETHER NEXUS</h1>

  <div class="resource-box">
    <div>所持エネルギー</div>
    <div class="energy-val" id="energy-disp">0 E</div>
    <div style="font-size: 0.85rem; color: var(--sub-text);" id="cps-disp">毎秒: 0 E</div>
    <div style="font-size: 0.8rem; color: #eccc68; margin-top: 5px;" id="prestige-disp">転生回数: 0 回</div>
  </div>

  <button class="tap-btn" id="core-btn">コア抽出</button>

  <div class="map-container">
    <div class="zone-title" id="current-zone-name">🌍 地球圏</div>
    <div class="map-nodes" id="map-nodes"></div>
    <div id="unlock-req-disp" style="font-size: 0.75rem; color: #ff6b6b; margin-top: 5px;"></div>
  </div>

  <div class="section-title">宙域固有の採掘装置</div>
  <div class="gen-list" id="gen-list"></div>

  <!-- テスト用転生ボタン -->
  <button class="prestige-btn" id="prestige-btn">転生を実行する (要: 50,000E)</button>
</div>

<script>
const game = {
  energy: 0,
  prestigeCount: 0,
  currentZone: 'earth',
  unlockedZones: ['earth'],
  generators: {}
};

// --- 20宙域データ（月面条件を転生数1に変更） ---
const ZONES = {
  earth:       { name: '🌍 地球圏', parent: null, req: {}, desc: '全ての始まりの地' },
  moon:        { name: '🌙 月面領域', parent: 'earth', req: { energy: 100000, prestige: 1 }, desc: '月面開発拠点' },
  mars:        { name: '🔴 火星圏', parent: 'moon', req: { energy: 1000000, prestige: 2 }, desc: 'テラフォーミング推進領域' },
  asteroids:   { name: '☄️ 小惑星帯', parent: 'moon', req: { energy: 500000, gen_solar: 30 }, desc: '鉱脈豊富な資源地帯' },
  jupiter:     { name: '🪐 木星圏', parent: 'mars', req: { energy: 10000000 }, desc: '巨大ガス惑星のエネルギー層' },
  saturn:      { name: '💍 土星環領域', parent: 'asteroids', req: { energy: 5000000, prestige: 2 }, desc: '環の粒子高効率採掘' },
  scorching:   { name: '🔥 灼熱宙域', parent: 'jupiter', req: { energy: 50000000 }, desc: '高熱超高威力環境' },
  ice:         { name: '❄️ 氷惑星帯', parent: 'saturn', req: { energy: 20000000 }, desc: '絶対ゼロ度・冷却バフ' },
  darkness:    { name: '🌑 暗黒星雲', parent: 'jupiter', req: { energy: 100000000, prestige: 3 }, desc: '未知の暗黒物質領域' },
  interstellar:{ name: '🌌 星間空間', parent: 'saturn', req: { energy: 1000000000 }, desc: '広大な銀河の隙間' },
  gravity:     { name: '🌀 重力異常宙域', parent: 'darkness', req: { energy: 5000000000, prestige: 4 }, desc: '時空が歪む危険領域' },
  ancient:     { name: '👽 古代文明宙域', parent: 'interstellar', req: { energy: 10000000000 }, desc: '超テクノロジーの遺構' },
  blackhole:   { name: '🕳️ ブラックホール宙域', parent: 'gravity', req: { energy: 50000000000, prestige: 5 }, desc: '事象の地平線' },
  life:        { name: '🧬 生命宙域', parent: 'blackhole', req: { energy: 100000000000 }, desc: '有益有機プラント' },
  quantum:     { name: '⚛️ 量子宙域', parent: 'blackhole', req: { energy: 100000000000 }, desc: '確率変動の空間' },
  fault:       { name: '⏳ 時空断層', parent: 'life', req: { energy: 500000000000, prestige: 7 }, desc: '時間の歪み' },
  core:        { name: '🌠 銀河中心部', parent: 'fault', req: { energy: 1000000000000, prestige: 10 }, desc: '高純度コアエネルギー' },
  dimension:   { name: '♾️ 異次元領域', parent: 'core', req: { energy: 10000000000000, prestige: 15 }, desc: '次元の壁を超えた先' },
  nexus:       { name: '🌀 ネクサス・ゲート', parent: 'dimension', req: { energy: 100000000000000, prestige: 20 }, desc: '終焉にして全知の門' }
};

const GENERATORS = {
  earth: [
    { id: 'gen_solar', name: 'ソーラーアレイ', cost: 15, cps: 1, desc: '基礎的な太陽光発電' }
  ],
  moon: [
    { id: 'gen_he3', name: 'ヘリウム3採掘炉', cost: 1200, cps: 20, desc: '月面特有の高効率燃料' }
  ],
  asteroids: [
    { id: 'gen_drill', name: '小惑星砕石ドリル', cost: 8000, cps: 120, desc: '鉱脈を一気に粉砕採掘' }
  ],
  mars: [
    { id: 'gen_geo', name: '地熱テラフォーマー', cost: 50000, cps: 600, desc: '地熱を吸い上げ電力変換' }
  ],
  scorching: [
    { id: 'gen_dyson', name: 'ダイソン球抽出機', cost: 5000000, cps: 45000, desc: '恒星の超高熱ダイレクト発電' }
  ],
  quantum: [
    { id: 'gen_quantum', name: '量子もつれ抽出機', cost: 100000000, cps: 800000, desc: '確率変動・超高出力' }
  ]
};

function checkCanUnlock(zoneKey) {
  const z = ZONES[zoneKey];
  if (!z) return false;
  if (z.parent && !game.unlockedZones.includes(z.parent)) return false;

  const r = z.req;
  if (r.energy && game.energy < r.energy) return false;
  if (r.prestige && game.prestigeCount < r.prestige) return false;
  if (r.gen_solar && (game.generators['gen_solar'] || 0) < r.gen_solar) return false;

  return true;
}

function renderUI() {
  document.getElementById('energy-disp').innerText = Math.floor(game.energy).toLocaleString() + ' E';
  document.getElementById('cps-disp').innerText = '毎秒: ' + getGlobalCPS().toLocaleString() + ' E';
  document.getElementById('prestige-disp').innerText = '転生回数: ' + game.prestigeCount + ' 回';
  document.getElementById('current-zone-name').innerText = ZONES[game.currentZone].name;

  const mapContainer = document.getElementById('map-nodes');
  mapContainer.innerHTML = '';
  
  Object.keys(ZONES).forEach(key => {
    const btn = document.createElement('button');
    const isUnlocked = game.unlockedZones.includes(key);
    const canUnlock = checkCanUnlock(key);

    btn.className = 'node-btn' + (isUnlocked ? ' unlocked' : '') + (game.currentZone === key ? ' active' : '');
    btn.innerText = ZONES[key].name.split(' ')[0];

    btn.onclick = () => {
      if (isUnlocked) {
        game.currentZone = key;
        renderUI();
      } else if (canUnlock) {
        game.unlockedZones.push(key);
        game.currentZone = key;
        renderUI();
      } else {
        const r = ZONES[key].req;
        let msg = ZONES[key].name + ' 解放条件: ';
        if (r.energy) msg += r.energy.toLocaleString() + 'E ';
        if (r.prestige) msg += '転生' + r.prestige + '回 ';
        if (r.gen_solar) msg += 'ソーラー' + r.gen_solar + '台 ';
        document.getElementById('unlock-req-disp').innerText = msg;
      }
    };
    mapContainer.appendChild(btn);
  });

  const genList = document.getElementById('gen-list');
  genList.innerHTML = '';
  const currentGens = GENERATORS[game.currentZone] || [];

  if (currentGens.length === 0) {
    genList.innerHTML = '<div style="font-size:0.8rem; color:var(--sub-text);">この宙域に購入可能な固有装置はありません</div>';
  } else {
    currentGens.forEach(g => {
      const count = game.generators[g.id] || 0;
      const currentCost = Math.floor(g.cost * Math.pow(1.15, count));

      const card = document.createElement('div');
      card.className = 'gen-card';
      card.innerHTML = `
        <div class="gen-info">
          <div class="gen-name">${g.name} (${count}台)</div>
          <div class="gen-desc">${g.desc} | +${g.cps} E/s</div>
          <div style="color:var(--accent-color); font-weight:bold;">${currentCost.toLocaleString()} E</div>
        </div>
        <button class="buy-btn" ${game.energy < currentCost ? 'disabled' : ''}>購入</button>
      `;

      card.querySelector('button').onclick = () => {
        if (game.energy >= currentCost) {
          game.energy -= currentCost;
          game.generators[g.id] = count + 1;
          renderUI();
        }
      };
      genList.appendChild(card);
    });
  }
}

function getGlobalCPS() {
  let total = 0;
  Object.keys(GENERATORS).forEach(z => {
    GENERATORS[z].forEach(g => {
      const count = game.generators[g.id] || 0;
      total += count * g.cps;
    });
  });
  return total;
}

document.getElementById('core-btn').onclick = () => {
  game.energy += 1;
  renderUI();
};

document.getElementById('prestige-btn').onclick = () => {
  if (game.energy >= 50000) {
    game.energy = 0;
    game.prestigeCount += 1;
    game.generators = {};
    alert('転生を実行しました！転生回数: ' + game.prestigeCount);
    renderUI();
  } else {
    alert('転生には 50,000 E 必要です！');
  }
};

setInterval(() => {
  game.energy += getGlobalCPS() / 10;
  renderUI();
}, 100);

renderUI();
</script>

</body>
</html>
